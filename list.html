<!-- list is a collection of items -->
 <!-- lists are of three types -->
  <!--<ul> <ol> <dl> are the types of list-->
    <!-- for changing the symbol in ul <ul type = "square"></ul>   ol has also same type -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul type = "square">
        <li> beetroot</li>
        <li> ginger</li>
        <li> animesh </li>
        <li>radish</li>
    </ul>

    <ol type = "A">
    <li> hello</li>
    <li> world</li>
    <li>!</li>
    </ol>

      <ol type = "1" start = "5">
    <li> hello</li>
    <li> world</li>
    <li>!</li>
    </ol>

     <ol type = "A" start="7">
    <li> hello</li>
    <li> world</li>
    <li>!</li>
    </ol>


    <dl>
        <dt> HTML</dt>
        <dd> hyper text markup language </dd>
        <dt> http</dt>
        <dd> hyper text transfer </dd>
    </dl>

    <!-- dl is used for start and end dt us used for term and dh is used for defining term -->
</body>
</html>
